flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/nays_logo.webp
  remove_alpha_ios: true
  adaptive_icon_background: '#0F3A2E'
  windows:
    generate: true
    image_path: assets/images/nays_logo.webp
    icon_size: 256
  adaptive_icon_foreground: assets/images/nays_logo.webp
  web:
    generate: true
    image_path: assets/images/nays_logo.webp
    background_color: '#0F3A2E'
    theme_color: '#1B4D3E'

